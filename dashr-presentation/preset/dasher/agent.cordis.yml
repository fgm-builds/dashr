# The `dasher` agent preset: DASHR's RLM mode — one persistent Python
# kernel as the model's whole tool interface.
#
# Like the built-in `code` preset, one call replaces a batch of tool calls:
# instead of five round-trips the model writes one Python program against the
# generated SDK and `run_cell` executes it. The two modes differ in the
# runtime behind that transport. `code` waits for the HOST plane's
# `codeRuntime` (the TypeScript worker-thread backend) and each run is an
# isolated fresh worker. `dasher` owns its runtime — the `dasher-kernel`
# group below mounts `dashr-code-runtime-ipython`, the stateful
# `ctx.rlmRuntime` provider — and every run is one cell on one persistent
# kernel: variables, imports, and definitions assigned in run N survive into
# run N+1 (state codification, deliberately NOT the per-run isolation the
# PTC backend provides).
#
# The tool REGISTRY itself stays on the host plane — the agent loop's
# scheduler and the API proxy's presenters are its consumers — so what this
# preset owns is the PRESENTATION of that registry for this agent alone,
# plus the runtime behind it. Native and PTC sessions run beside this one in
# the same process, each seeing its own catalog; a PTC Code-Mode session
# still resolves the host's `codeRuntime` while this preset's `rlmRuntime`
# stays behind its own realm, so neither runtime ever switches the other.
#
# This file is an AGENT-PLANE composition. It is mounted under one agent
# composition's standing scope, so every tool and prompt section it
# registers belongs to that composition alone. The host composition keeps
# everything a preset must not own: the registries themselves, the sandbox
# and approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global
# and the second mount of this preset collides with the first;
# `dsh-agent-presets` rejects that at mount. `true` means an entry-local
# realm — one private instance per mounted composition — which is the
# lifetime a kernel provider needs: a host reader (a cold transcript read)
# can never resolve it, and nothing outside this group can consume it. A
# shared label would instead pool one instance across every mount naming it.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# Same row shape as the `code` preset; only the mode it describes differs —
# work happens inside one long-lived kernel. Whose state that kernel holds is
# per-session under BOTH mount granularities since M3-A: the provider keys
# one kernel per Session/Agent inside its (possibly shared) service instance
# and tears it down on `agent/disposed`, so sessions joined to one roster
# mount share the provider but never a namespace (see this package's README,
# "Realm semantics").
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a Dasher agent powered by the {{model}} model. Your working directory is {{cwd}}.
      You do all work through `run_cell`: each call runs one Python program on your persistent
      kernel, and everything you import, define, or assign in one cell stays available in the
      next. Use the kernel as your one and only tool interface.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── runtime + presentation ──────────────────────────────────────────────────

# The Dasher runtime. The provider row publishes `ctx.rlmRuntime` behind an
# entry-local realm, so the host plane never sees it and a PTC Code-Mode
# session's `codeRuntime` stays untouched (same process, each on its own
# runtime). The presentation row sits INSIDE the same group: a realm-private
# service resolves only for rows sharing the realm, and the `run_cell`
# transport reads `ctx.rlmRuntime` at use time. (The row's position is
# load-bearing: moved OUTSIDE the group the preset still MOUNTS, but the
# presentation silently degrades to the native view — no `run_cell`, no SDK
# section — because the row's static `tools` inject is satisfied while its
# internal `rlmRuntime` wait never fires. See the omission section at the
# bottom of this file for the full note.)
#
# Both rows are bare package specifiers. The roster resolves those from the
# HOST composition's baseUrl, not from the preset directory — a locally
# authored preset lives under the user's home, where Node's upward
# node_modules walk never reaches the harness. `dsh plugin add
# dashr-code-runtime-ipython` (and this package itself) puts them on the
# host's module path; no pre-registration on the host plane is needed.
#
# The provider config carries only the tunables worth overriding from a
# preset; every line below is the package default spelled out (drop any to
# take it):
#   python       `python3` unless DASHR_KERNEL_PYTHON is set — the
#                interpreter the kernel spawns; it must have `ipykernel`
#                installed (create one with `npm run kernel:venv` in the
#                dashr package).
#   cwd          unset → the kernel subprocess inherits the host process
#                cwd. A shipped preset cannot know any one workspace, so
#                leave it unset here; set it in a local copy of the preset.
#   snapshotDir            unset → no snapshots. When set, the provider
#                          writes `<snapshotDir>/<session>/state.dill` +
#                          `manifest.json` per session kernel — after EVERY
#                          successful run (turn-end, size-capped by
#                          snapshotSizeCapBytes, default 256 MiB) and again at
#                          teardown (session end or dispose) — and restores
#                          that snapshot on the session kernel's next boot.
#                          A dead kernel respawns onto its nearest replayable
#                          snapshot; a non-replayable one degrades to EMPTY
#                          and says so (blueprint §8).
- id: dasher-kernel
  name: cordis:group
  group: true
  isolate:
    rlmRuntime: true
  config:
    - id: dashr-code-runtime-ipython
      name: dashr-code-runtime-ipython
      config:
        python: !!js process.env.DASHR_KERNEL_PYTHON ?? 'python3'

    # The presentation row's config knobs (M4-A + M4-B). All are opt-in:
    # unset means inheritance or disabled, never a silent default — and an
    # EMPTY string on any of them fails the mount loudly (it is a typo of
    # "unset", not a value).
    #
    # `subagentModel` (M4-A) — the composition-wide default model for
    # rlm()-spawned children. The full priority is three-level: a per-call
    # `rlm(prompt, model="...")` kwarg wins over this key, this key wins
    # over leaving the child on the parent agent's own model, and ALL three
    # tiers are opt-in — with neither kwarg nor key set, the start request
    # carries no `agentOptions` and the harness's own parent-inheritance
    # applies (zero DASHR-side assumptions about the parent's route). Set it
    # when a deployment runs children on a cheaper model than the parent.
    #
    # `harnessDir` (M4-B) — the Continual Harness store: per-agent durable
    # prompt state (notes/memories/skills) that the `dasher:harness` prompt
    # section re-renders at EVERY assembly (prompt-as-variable) and that
    # cells edit through `await refine(instruction)` (one auxiliary model
    # call → validated add/update/delete ops; anything unparseable leaves
    # the store untouched). Unset = memory-only: the harness dies with this
    # composition. Set it to a stable path when agents should REMEMBER
    # across restarts — one `harness.json` per agent id under this root,
    # atomically written, restored by the next composition of the same id.
    # It is deliberately separate from the runtime's `snapshotDir`: kernel
    # snapshots carry variables, the harness carries prompt state, and the
    # two persistence channels never invalidate each other.
    #
    # `refineModel` (M4-B) — the model route for refine()'s auxiliary call:
    # `'provider/model'` selects explicitly, a bare model id pairs with the
    # calling agent's own provider, and unset uses the agent's own
    # provider+model. Refinement writes DURABLE prompt state, so the
    # default is the agent's own model — set this only to route refinement
    # to a cheaper/stronger model than the conversation.
    #
    # `compactModel` (M4-B) — the summarization model for the in-cell
    # `await compact()` binding (the PA check-usage→summarize→keep-working
    # semantics). When set, a DASHR-scoped `BasicCompactionEngine` mounts
    # lazily on first compact() call under a runtime `ctx.isolate('compaction')`
    # realm (not a yml entry-local isolate) with this route
    # and `auto: false` (the host engine — if the host composition mounted
    # one — keeps the automatic listeners and is never disturbed; the
    # scoped engine never resolves outside this composition). Requires the
    # optional peer `@deepseek-ai/dsh-compaction-basic` to be installed.
    # UNSET (the default) inherits the HOST-mounted `ctx.compaction` engine
    # and its model chain (configured ?? latest-request ?? agent) — i.e.
    # "follow the session model"; with no host engine, compact() answers a
    # structured unavailable error. The single-key design keeps ONE place
    # to set the compaction model for Dasher agents: no second
    # summarizationModel row to keep in sync.
    #   config:
    #     subagentModel: zai/glm-5.2
    #     harnessDir: ~/.dasher/harness
    #     refineModel: zai/glm-5.2
    #     compactModel: zai/glm-5.2
    - id: dashr-tool-presentation
      name: dashr-tool-presentation

# ── filesystem ──────────────────────────────────────────────────────────────

# Like the `minimal` preset's filesystem group: the bare local filesystem is
# an agent-owned service, so `fs` sits in an entry-local realm and the tool
# row resolves that realm-private provider. This DIFFERS from the `code`
# preset, which registers `tool-fs` against the HOST's sandboxed fs service
# with no realm — a sandbox stack is host-plane by nature, and this preset
# must mount on a bare host, so the local backend stands in (the same
# tradeoff `minimal` makes; the host can still shadow it for this preset
# layer if a deployment owns a stricter backend).
#
# `dsh-tool-bash`/`dsh-tool-pwsh` are deliberately ABSENT for the same
# reason: their executors (`bash-sandbox`/`pwsh-sandbox`) are host-plane
# services a bare host does not supply, and shell work belongs inside the
# kernel anyway — the kernel IS the shell here. `dsh-tool-fs-search` is
# absent because its ripgrep/subprocess/spill stack is host-plane weight
# with a native dependency; kernel-side Python covers search. Within
# `tool-fs` itself, `read`/`write`/`edit` register unconditionally while
# `read_image` waits for an `attachments` service the host owns — image
# attachment content is a host-plane capability, so a bare host simply sees
# the three text tools.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

# ── model-facing tools ──────────────────────────────────────────────────────

# Registers into the host `tools` registry's preset layer and provides no
# service, so it needs no realm (the same reasoning as the `code` preset's
# row). It is also first-class material for the binding bridge: every tool
# the registry exposes to this agent becomes a `tools.<name>` binding inside
# kernel-side Python, so the model calls it from within a `run_cell`
# program — `tools.todo_write`, `tools.read`, `tools.write`, `tools.edit`.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── rows the `code` preset carries that this one deliberately omits ────────

# Everything above is the whole preset: identity, the runtime + its
# presentation, a bare-local filesystem, and the todo tool. The `code`
# preset carries many more model-facing rows; each is omitted here for a
# host-plane reason, and a Dasher deployment composes the ones it wants on
# the HOST composition (the layer that owns the singletons those rows
# resolve), which is also where the `code` preset keeps their services:
#
# - `dsh-tool-bash` / `dsh-tool-pwsh` — executors (`bash-sandbox` /
#   `pwsh-sandbox`) are host-plane services; a bare host cannot supply them,
#   and shell work belongs inside the kernel anyway (see the filesystem
#   section above).
# - `dsh-tool-fs-search` — its ripgrep/subprocess/spill stack is host-plane
#   weight plus a native dependency; kernel-side Python covers search.
# - `dsh-tool-jobs` / background jobs — the task REGISTRY is a host-plane
#   singleton whose producers (`tool-bash`) sit outside any realm here.
# - `dsh-tool-skill` / `dsh-skill-filesystem` — the skill REGISTRY is
#   host-composed and layered per scope; a deployment that ships skills
#   composes the loaders on the host.
# - `dsh-tool-goal` — the goal service, its session driver, and the `/goal`
#   command are host-plane (the Gateway serves the domain remotely).
# - `dsh-plan-mode` — plan state folds from the SESSION LOG, so it needs no
#   agent-plane row; a deployment wanting plan mode composes it host-side
#   or in a copy of this preset.
# - `dsh-compaction-basic` / its pruner — the tokenMeter it reads beside is
#   a host singleton; compaction is a deployment choice, not a preset's.
# - delegation (`dsh-tool-subagent*` / `dsh-tool-workflow` /
#   `dsh-tool-ralph`) — the `subagents` registry and spawn/fork backends
#   are host-plane singletons (a provider name registers once per process).
#   The cell-level `rlm()`/`rlm_await()` bindings still reach them: this
#   presentation row sits inside the `rlmRuntime` isolate realm, and cordis
#   resolves an OUTER (root) service for a name the inner realm does not
#   isolate, so `ctx.get('subagents')` sees the host singleton while the
#   realm-private runtime stays hidden from the host.
# - `dsh-tool-ask-user` / `dsh-tool-web` — both resolve host-plane
#   registries (the web service, the question surfaces); a headless or
#   kernel-only deployment wants neither.
#
# The omission that is NOT a host-plane call: this preset mounts no
# `tool-presentation` row of its own — the Dasher presentation row already
# sits INSIDE the `dasher-kernel` group above, and one composition carries
# exactly one presentation (two would register the same transport names into
# one layer). Moving that row OUT of the group is not a legal variant: a
# realm-private `rlmRuntime` resolves only for rows sharing the realm, so a
# presentation row outside the group silently degrades — its static
# `inject: ['tools']` is satisfied, its internal `ctx.inject(['rlmRuntime'])`
# never fires, the mount succeeds without a diagnostic, and the agent's
# assembly falls back to the native view (no `run_cell`, no SDK section).
