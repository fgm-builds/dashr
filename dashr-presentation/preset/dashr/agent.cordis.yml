# The `dashr` agent preset: DASHR's RLM mode — the standard coding agent,
# presented through one persistent Python kernel.
#
# Stacking logic (2026-08-16): like the built-in `code` (PTC) and
# `cordis` presets, this composition is the `standard` preset's rows UNCHANGED
# plus this preset's own additions. Below that line the delta is two rows in
# one group: `dashr-code-runtime-ipython` (the stateful kernel provider,
# published as `ctx.rlmRuntime`) and `dashr-tool-presentation` (the run_cell
# transport: the model writes one Python program against the generated SDK
# and one `run_cell` call executes it — every tool in the catalog above,
# including bash, web, skills, goals, and delegation, is reachable from
# inside the kernel as a `tools.<name>(...)` binding).
#
# Unlike `code` (PTC), whose each run is an isolated fresh worker, `dashr`
# owns its runtime: every run is one cell on one persistent kernel —
# variables, imports, and definitions assigned in run N survive into run N+1.
# Per-session since M3-A: the provider keys one kernel per Session/Agent
# inside its (possibly shared) service instance and tears it down on
# `agent/disposed`, so sessions joined to one roster mount share the provider
# but never a namespace (see the package README, "Realm semantics").
#
# The tool REGISTRY itself stays on the host plane — the agent loop's
# scheduler and the API proxy's presenters are its consumers — so what this
# preset owns is the PRESENTATION of that registry for this agent alone,
# plus the runtime behind it. Native and PTC sessions run beside this one in
# the same process, each seeing its own catalog; a PTC Code-Mode session
# still resolves the host's `codeRuntime` while this preset's `rlmRuntime`
# stays behind its own realm, so neither runtime ever switches the other.
#
# This file is an AGENT-PLANE composition. The host composition keeps
# everything a preset must not own: the registries themselves, the sandbox
# and approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global
# and the second mount of this preset collides with the first;
# `dsh-agent-presets` rejects that at mount. `true` means an entry-local
# realm — one private instance per mounted composition — which is the
# lifetime a kernel provider needs: a host reader (a cold transcript read)
# can never resolve it, and nothing outside this group can consume it. A
# shared label would instead pool one instance across every mount naming it.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# Same shape as the `standard` preset's row; the text adds the RLM contract.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a DASHR agent powered by the {{model}} model. Your working directory is {{cwd}}.
      You have a persistent Python kernel as your primary tool interface: each `run_cell` call
      executes one Python program on it, and everything you import, define, or assign in one cell
      stays available in the next. The full tool catalog is callable from inside the kernel as
      `tools.<name>(...)` bindings. Prefer the kernel for multi-step work.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── runtime + presentation ──────────────────────────────────────────────────

# The DASHR runtime. The provider row publishes `ctx.rlmRuntime` behind an
# entry-local realm, so the host plane never sees it and a PTC Code-Mode
# session's `codeRuntime` stays untouched (same process, each on its own
# runtime). The presentation row sits INSIDE the same group: a realm-private
# service resolves only for rows sharing the realm, and the `run_cell`
# transport reads `ctx.rlmRuntime` at use time. (The row's position is
# load-bearing: moved OUTSIDE the group the preset still MOUNTS, but the
# presentation silently degrades to the native view — no `run_cell`, no SDK
# section — because the row's static `tools` inject is satisfied while its
# internal `rlmRuntime` wait never fires.)
#
# Both rows are bare package specifiers. The roster resolves those from the
# HOST composition's baseUrl, not from the preset directory — a locally
# authored preset lives under the user's home, where Node's upward
# node_modules walk never reaches the harness. `dsh plugin add
# dashr-code-runtime-ipython` (and this package itself) puts them on the
# host's module path; no pre-registration on the host plane is needed.
#
# The provider config carries only the tunables worth overriding from a
# preset; every line below is the package default spelled out (drop any to
# take it):
#   python       `python3` unless DASHR_KERNEL_PYTHON is set — the
#                interpreter the kernel spawns; it must have `ipykernel`
#                installed (create one with `npm run kernel:venv` in the
#                dashr package).
#   cwd          unset → the kernel subprocess inherits the host process
#                cwd. A shipped preset cannot know any one workspace, so
#                leave it unset here; set it in a local copy of the preset.
#   snapshotDir            unset → no snapshots. When set, the provider
#                          writes `<snapshotDir>/<session>/state.dill` +
#                          `manifest.json` per session kernel — after EVERY
#                          successful run (turn-end, size-capped by
#                          snapshotSizeCapBytes, default 256 MiB) and again at
#                          teardown (session end or dispose) — and restores
#                          that snapshot on the session kernel's next boot.
#                          A dead kernel respawns onto its nearest replayable
#                          snapshot; a non-replayable one degrades to EMPTY
#                          and says so (blueprint §8).
- id: dashr-kernel
  name: cordis:group
  group: true
  isolate:
    rlmRuntime: true
  config:
    - id: dashr-code-runtime-ipython
      name: dashr-code-runtime-ipython
      config:
        python: !!js process.env.DASHR_KERNEL_PYTHON ?? 'python3'

    # The presentation row's config knobs (M4-A + M4-B). All are opt-in:
    # unset means inheritance or disabled, never a silent default — and an
    # EMPTY string on any of them fails the mount loudly (it is a typo of
    # "unset", not a value).
    #
    # `subagentModel` (M4-A) — the composition-wide default model for
    # rlm()-spawned children. The full priority is three-level: a per-call
    # `rlm(prompt, model="...")` kwarg wins over this key, this key wins
    # over leaving the child on the parent agent's own model, and ALL three
    # tiers are opt-in — with neither kwarg nor key set, the start request
    # carries no `agentOptions` and the harness's own parent-inheritance
    # applies (zero DASHR-side assumptions about the parent's route). Set it
    # when a deployment runs children on a cheaper model than the parent.
    #
    # `harnessDir` (M4-B) — the Continual Harness store: per-agent durable
    # prompt state (notes/memories/skills) that the `dashr:harness` prompt
    # section re-renders at EVERY assembly (prompt-as-variable) and that
    # cells edit through `await refine(instruction)` (one auxiliary model
    # call → validated add/update/delete ops; anything unparseable leaves
    # the store untouched). Unset = memory-only: the harness dies with this
    # composition. Set it to a stable path when agents should REMEMBER
    # across restarts — one `harness.json` per agent id under this root,
    # atomically written, restored by the next composition of the same id.
    # It is deliberately separate from the runtime's `snapshotDir`: kernel
    # snapshots carry variables, the harness carries prompt state, and the
    # two persistence channels never invalidate each other.
    #
    # `refineModel` (M4-B) — the model route for refine()'s auxiliary call:
    # `'provider/model'` selects explicitly, a bare model id pairs with the
    # calling agent's own provider, and unset uses the agent's own
    # provider+model. Refinement writes DURABLE prompt state, so the
    # default is the agent's own model — set this only to route refinement
    # to a cheaper/stronger model than the conversation.
    #
    # `compactModel` (M4-B) — the summarization model for the in-cell
    # `await compact()` binding (the PA check-usage→summarize→keep-working
    # semantics). When set, a DASHR-scoped `BasicCompactionEngine` mounts
    # lazily on first compact() call under a runtime `ctx.isolate('compaction')`
    # realm (not a yml entry-local isolate) with this route
    # and `auto: false` (the host engine — if the host composition mounted
    # one — keeps the automatic listeners and is never disturbed; the
    # scoped engine never resolves outside this composition). Requires the
    # optional peer `@deepseek-ai/dsh-compaction-basic` to be installed.
    # UNSET (the default) resolves the preset's own `compaction` realm
    # (this composition carries the `standard` compaction group above, whose
    # engine compacts automatically and uses its own model chain —
    # configured ?? latest-request ?? agent); on a composition without that
    # group, the HOST-mounted engine serves, and with no engine at all,
    # compact() answers a structured unavailable error. When this key IS
    # set, the DASHR-scoped engine mounts in a NESTED private realm inside
    # the `rlmRuntime` isolate — it never collides with the preset's own
    # compaction group (different realm, and `auto: false` keeps the
    # preset engine's automatic listeners untouched). The single-key design
    # keeps ONE place to set the compaction model for DASHR agents: no
    # second summarizationModel row to keep in sync.
    #   config:
    #     subagentModel: zai/glm-5.2
    #     harnessDir: ~/.dashr/harness
    #     refineModel: zai/glm-5.2
    #     compactModel: zai/glm-5.2
    - id: dashr-tool-presentation
      name: dashr-tool-presentation


# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
