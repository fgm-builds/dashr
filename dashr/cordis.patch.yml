# DASHR bundle patch: one isolated group on the profile plane, mounting the
# stateful kernel provider + run_cell presentation — the same dashr-kernel
# group the rlm-mode agent preset mounts (preset/rlm-mode/agent.cordis.yml).
# The full RLM Mode stack (standard-composition include + persona patch) is
# delivered by the rlm-mode preset, localized by install.sh.
#
# Kernel Python defaults to `python3` (the plugin's config default). If your
# ipykernel lives elsewhere, override it from your profile's own
# cordis.patch.yml:
#
#   - id: dashr-kernel
#     config:
#       - id: dsh-rlm-mode
#         config:
#           python: /path/to/kernel/python
- insert:
    - id: dashr-kernel
      name: cordis:group
      group: true
      isolate:
        rlmRuntime: true
      config:
        - id: dsh-rlm-mode
          name: dsh-rlm-mode
