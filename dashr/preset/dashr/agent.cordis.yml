# The `dashr` agent preset: DASHR's RLM mode — the standard coding agent,
# presented through one persistent Python kernel.
#
# Stacking logic (2026-08-17, include-based): the first row includes the
# installed harness's OWN `standard` agent composition (the rows upstream
# ships and updates — tools, prompts, compaction, plan mode) and patches
# only the persona row; this preset's own delta is the single `dashr-kernel`
# group below. Upstream gains, removes, or reconfigures a standard tool and
# this preset follows automatically — no copied rows to re-sync.
#
# The include path is a LITERAL string baked in by `install.sh` (the
# standard composition lives inside the dsh package, whose install location
# is machine-specific). It cannot be a `!!js` env expression: group rows
# (the include row is an EntryGroup) skip loader interpolation.
#
# The dashr-kernel group is ONE row: `dsh-rlm-mode`, which mounts the
# stateful kernel provider (published as `ctx.rlmRuntime`) and the run_cell
# transport in that order — the model writes one Python program against the
# generated SDK and one `run_cell` call executes
# it — every tool in the catalog, including bash, web, skills, goals, and
# delegation, is reachable from inside the kernel as a
# `tools.<name>(...)` binding).
#
# Unlike `code` (PTC), whose each run is an isolated fresh worker, `dashr`
# owns its runtime: every run is one cell on one persistent kernel —
# variables, imports, and definitions assigned in run N survive into run N+1.
# Per-session since M3-A: the provider keys one kernel per Session/Agent
# inside its (possibly shared) service instance and tears it down on
# `agent/disposed`, so sessions joined to one roster mount share the provider
# but never a namespace (see the package README, "Realm semantics").
#
# The tool REGISTRY itself stays on the host plane — the agent loop's
# scheduler and the API proxy's presenters are its consumers — so what this
# preset owns is the PRESENTATION of that registry for this agent alone,
# plus the runtime behind it. Native and PTC sessions run beside this one in
# the same process, each seeing its own catalog; a PTC Code-Mode session
# still resolves the host's `codeRuntime` while this preset's `rlmRuntime`
# stays behind its own realm, so neither runtime ever switches the other.
#
# This file is an AGENT-PLANE composition. The host composition keeps
# everything a preset must not own: the registries themselves, the sandbox
# and approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global
# and the second mount of this preset collides with the first;
# `dsh-agent-presets` rejects that at mount. `true` means an entry-local
# realm — one private instance per mounted composition — which is the
# lifetime a kernel provider needs: a host reader (a cold transcript read)
# can never resolve it, and nothing outside this group can consume it. A
# nested isolate key inside the group entry makes one instance per scope,
# which is what the optional `compactModel` DASHR mount needs (see the
# package README, "Compaction realm").
#
- name: '@deepseek-ai/cordis-plugin-include'
  config:
    # install.sh rewrites this placeholder to the resolved absolute path of
    # the installed dsh's standard preset. The test harness substitutes it
    # the same way before mounting.
    path: DASHR_PLACEHOLDER_standard_preset_path_install_script_required
    patches:
      - id: persona
        config:
          text: >-
            You are a DASHR agent powered by the {{model}} model. Your working directory is {{cwd}}.
            You have a persistent Python kernel as your primary tool interface: each `run_cell` call
            executes one Python program on it, and everything you import, define, or assign in one cell
            stays available in the next. The full tool catalog is callable from inside the kernel as
            `tools.<name>(...)` bindings. Prefer the kernel for multi-step work.

- id: dashr-kernel
  name: cordis:group
  group: true
  isolate:
    rlmRuntime: true
  config:
    - id: dsh-rlm-mode
      name: dsh-rlm-mode
      config:
        python: !!js process.env.DASHR_KERNEL_PYTHON ?? 'python3'
