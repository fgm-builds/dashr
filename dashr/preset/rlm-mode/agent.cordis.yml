# The `rlm-mode` agent preset: DASHR's RLM mode — the standard coding agent,
# presented through one persistent Python kernel.
#
# Stacking logic (2026-08-17, include-based): the first row includes the
# installed harness's OWN `standard` agent composition (the rows upstream
# ships and updates — tools, prompts, compaction, plan mode) and patches
# only the persona row; this preset's own delta is the single `dashr-kernel`
# group below. Upstream gains, removes, or reconfigures a standard tool and
# this preset follows automatically — no copied rows to re-sync.
#
# The include path is a LITERAL string baked in by `install.sh` (the
# standard composition lives inside the dsh package, whose install location
# is machine-specific). It cannot be a `!!js` env expression: group rows
# (the include row is an EntryGroup) skip loader interpolation.
#
# The dashr-kernel group is ONE row: `dsh-rlm-mode`, which mounts the
# stateful kernel runtime `DashrRuntime` (published as `ctx.rlmRuntime`)
# and the ipython transport in that order — the model writes one Python
# program against the generated SDK and one `ipython` call executes it —
# every tool in the catalog, including bash, web, skills, goals, and
# delegation, is reachable from inside the kernel as a flat
# `await name(args)` function; the delegation tools are bridged under the
# DASHR names rlm()/agent_message/agent_list/rlm_workflow/rlm_ralph —
# masked from the catalog, dispatched through the tool layer).
#
# Unlike `code` (PTC), whose each run is an isolated fresh worker, `dashr`
# owns its runtime: every run is one cell on one persistent kernel —
# variables, imports, and definitions assigned in run N survive into run N+1.
# Per-session since M3-A: the provider keys one kernel per Session/Agent
# inside its (possibly shared) service instance and tears it down on
# `agent/disposed`, so sessions joined to one roster mount share the provider
# but never a namespace (see the package README, "Realm semantics").
#
# v0.1.5 layering (plan §2): `DashrRuntime` lives at the standing-mount layer
# — this preset's mount — and is the de facto daemon: the cross-session
# kernel map, the `agent/disposed` listening, and the snapshot lifecycle all
# live in it. The profile-level `DashrDaemon` concept is a v0.1.5 empty shell
# (cordis.patch.yml stays `[]`); the session layer is each ipykernel
# subprocess, a pure Python interpreter with no harness awareness.
#
# The tool REGISTRY itself stays on the host plane — the agent loop's
# scheduler and the API proxy's presenters are its consumers — so what this
# preset owns is the PRESENTATION of that registry for this agent alone,
# plus the runtime behind it. Native and PTC sessions run beside this one in
# the same process, each seeing its own catalog; a PTC Code-Mode session
# still resolves the host's `codeRuntime` while this preset's `rlmRuntime`
# stays behind its own realm, so neither runtime ever switches the other.
#
# This file is an AGENT-PLANE composition. The host composition keeps
# everything a preset must not own: the registries themselves, the sandbox
# and approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global
# and the second mount of this preset collides with the first;
# `dsh-agent-presets` rejects that at mount. `true` means an entry-local
# realm — one private instance per mounted composition — which is the
# lifetime a kernel provider needs: a host reader (a cold transcript read)
# can never resolve it, and nothing outside this group can consume it. A
# nested isolate key inside the group entry makes one instance per scope,
# which is what the optional `compactModel` DASHR mount needs (see the
# package README, "Compaction realm").
#
- name: '@deepseek-ai/cordis-plugin-include'
  config:
    # install.sh rewrites this placeholder to the resolved absolute path of
    # the installed dsh's standard preset. The test harness substitutes it
    # the same way before mounting.
    path: DASHR_PLACEHOLDER_standard_preset_path_install_script_required
    patches:
      - id: persona
        config:
          text: >-
            You are a DASHR agent powered by the {{model}} model. Your working directory is {{cwd}}.

      # ── Delegation depth (plan Q5/Q17/Q22/Q23) ─────────────────────────
      # Patch config REPLACES the target row's config wholesale, so both
      # delegation rows restate their FULL standard-preset config (provider,
      # toolName, backgroundMode — keeping `continuable`, which the A2A
      # uplink and send_message depend on) and add `maxDepth: 10`: default
      # AND cap, a deployment-level budget the model can never pass as a
      # call parameter.
      #
      # IMPLEMENTATION CHECKPOINT (verified against cordis-plugin-loader
      # 1.0.2): include-patch config values DO support `!!js` — patch config
      # lands on the TARGET entries (ordinary plugins), whose config IS
      # interpolated; only the include ROW's own config skips it (the Include
      # row itself is the EntryGroup). We still HARDCODE maxDepth at 10 as a
      # deliberate conservative choice (byte-identical restatement, no extra
      # env surface to drift); THIS comment marks THE config point to edit
      # for recursion depth.
      #
      # DRIFT RISK (plan risk #2, accepted): upstream changing these rows'
      # config silently diverges from the restatement above — re-check these
      # two patches against the standard preset on every upstream upgrade.
      - id: tool-subagent
        config:
          provider: spawn
          toolName: subagent
          backgroundMode: continuable
          maxDepth: 10
      - id: tool-subagent-fork
        config:
          provider: fork
          toolName: subagent_fork
          backgroundMode: continuable
          maxDepth: 10
      # Child model selection (plan Q24): per-call `model=` is gone (the
      # bridge dispatches the tool layer, whose schema has no model
      # parameter — ADR-0001), so a non-inheriting child model is this same
      # deployment-level patch via agentOptions.model. Uncomment BOTH the
      # key and the example value below, restating the full row config as
      # above (patch config is replaced, not merged):
      # - id: tool-subagent
      #   config:
      #     provider: spawn
      #     toolName: subagent
      #     backgroundMode: continuable
      #     maxDepth: 10
      #     agentOptions:
      #       model: provider/model-id

- id: dashr-kernel
  name: cordis:group
  group: true
  isolate:
    rlmRuntime: true
  config:
    - id: dsh-rlm-mode
      name: dsh-rlm-mode
      config:
        python: !!js process.env.DASHR_KERNEL_PYTHON ?? 'python3'
        # Context Recency Window (Feature 1, OPT-IN — both keys commented
        # out by default so behavior matches a plain dsh deployment exactly).
        # Uncomment recencyWindowTokens, retainTokens, AND add a full
        # "provider/model" compactModel above to enable: when the session's
        # measured pressure exceeds the ceiling, the recency engine compacts
        # with the retainTokens tail — independent of the model's own context
        # window (the upstream 0.8 x model-window threshold stays active as a
        # second trigger arm; whichever ceiling is lower fires first).
        # ~500K tokens = 1-2 MB of mixed text; tune per deployment.
        # recencyWindowTokens: 500000
        # Absolute post-compaction retained tail (upstream retainTokens,
        # passed through). Must stay below recencyWindowTokens — the recency
        # engine machine-checks that invariant at mount.
        # retainTokens: 50000
