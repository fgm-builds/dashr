<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="dk-t dk-d">
  <title id="dk-t">Dash knot</title>
  <desc id="dk-d">Two interlocking links from the ash ligature ae, woven over-under into an infinity chain.</desc>
  <rect width="200" height="200" rx="44" fill="#f4f1ea"/>

  <!-- 编织：上交点 B 压 A（A 顶开口），下交点 A 压 B（B 底开口） -->
  <g fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round">
    <!-- A 顶（穿到 B 后面，中段开口） -->
    <path d="M 48 100 A 32 32 0 0 0 92.3 70.5"/>
    <path d="M 106.1 81.6 A 32 32 0 0 0 112 100"/>
    <!-- B 底（穿到 A 后面，中段开口） -->
    <path d="M 88 100 A 32 32 0 0 1 107.7 129.5"/>
    <path d="M 93.9 118.4 A 32 32 0 0 1 152 100"/>
    <!-- A 底（压 B） -->
    <path d="M 48 100 A 32 32 0 0 1 112 100"/>
    <!-- B 顶（压 A） -->
    <path d="M 88 100 A 32 32 0 0 0 152 100"/>
  </g>
</svg>
